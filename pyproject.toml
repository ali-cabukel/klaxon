[project]
name = "klaxon"
version = "0.1.0"
description = "Incident management desk with REST APIs, MCP tools, and a Slack agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "greenlet>=3.0",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.2",
    "mcp>=1.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
klaxon-api = "klaxon.api.app:run"
klaxon-seed = "klaxon.seed:main"
klaxon-mcp = "klaxon.mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
